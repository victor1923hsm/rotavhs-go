# Teste de ponta a ponta no ANDROID (emulador com WebView real, toque nativo pelo adb), autorizado em 2026-11-25.
# Fluxo: importar planilha SPX sintética → "Confirmar importação" → tela Rotas (10, 50, 100, 200 pacotes,
# endereços repetidos, coordenadas ausentes e inválidas, pacote repetido, XLSX).
# Fase R-A: OTIMIZAR a partir da posição do GPS do emulador (50, 100, 250, 500 paradas), cancelar e reotimizar.
# O app testado vem de "ref" (padrão: este commit); o roteiro de teste vem sempre deste commit.
# Só dados sintéticos. Não publica nada.
name: Teste Android (importação e otimização)

on:
  push:
    branches: [v2-dev]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit ou branch do app a testar'
        required: false
        default: ''
      filtro:
        description: 'Só os casos cujo nome contém este texto'
        required: false
        default: ''
      repetir:
        description: 'Repetir cada caso N vezes'
        required: false
        default: '1'
      filtro_otimizacao:
        description: 'Só os casos de otimização cujo nome contém este texto'
        required: false
        default: ''
  workflow_call:

permissions:
  contents: read

jobs:
  emulador:
    if: github.repository == 'victor1923hsm/rotavhs-go'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: teste
      - uses: actions/checkout@v4
        with:
          path: app
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Compilar o APK debug do app testado
        working-directory: app
        run: |
          npm ci
          npm run build:nativo
          npx cap sync android
          gradle -p android assembleDebug --no-daemon
      - name: Preparar o roteiro de teste
        working-directory: teste
        run: npm i --no-save playwright-core@1.65.1
      - name: Ativar KVM (emulador acelerado)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulador Android 14 + teste
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          ram-size: 4096M
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: adb install -r app/android/app/build/outputs/apk/debug/app-debug.apk && adb logcat -c && FILTRO="${{ inputs.filtro }}" REPETIR="${{ inputs.repetir || '1' }}" node teste/e2e/importacao.mjs android; r=$?; echo "== otimização (R-A)"; FILTRO="${{ inputs.filtro_otimizacao }}" node teste/e2e/otimizacao.mjs android; r2=$?; [ $r -eq 0 ] && r=$r2; echo "== memória do aparelho"; adb shell cat /proc/meminfo | head -3; echo "== logcat (WebView, falhas, memória)"; adb logcat -d | grep -iE "FATAL|crash|renderer|lowmemorykiller|am_kill|Out of memory|chromium.*(error|fatal)|tombstone" | tail -40; echo "== logcat do app e da WebView (diagnóstico)"; adb logcat -d | grep -iE "rotavhs|cr_|chromium|WebView|ActivityManager:.(Start|Kill|Process|Force)|am_proc_died|am_crash|Capacitor" | grep -viE "NamespaceManager" | tail -120; exit $r
