# Teste de ponta a ponta no ANDROID (emulador com WebView real, toque nativo pelo adb), autorizado em 2026-11-25.
# Fluxo: importar planilha SPX sintética → "Confirmar importação" → tela Rotas (10, 50, 100, 200 pacotes,
# endereços repetidos, coordenadas ausentes e inválidas, pacote repetido, XLSX).
# O app testado vem de "ref" (padrão: este commit); o roteiro de teste vem sempre deste commit.
# Só dados sintéticos. Não publica nada.
name: Teste Android (importação)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit ou branch do app a testar'
        required: false
        default: ''
  workflow_call:

permissions:
  contents: read

jobs:
  emulador:
    if: github.repository == 'victor1923hsm/rotavhs-go'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: teste
      - uses: actions/checkout@v4
        with:
          path: app
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Compilar o APK debug do app testado
        working-directory: app
        run: |
          npm ci
          npm run build:nativo
          npx cap sync android
          gradle -p android assembleDebug --no-daemon
      - name: Preparar o roteiro de teste
        working-directory: teste
        run: npm i --no-save playwright-core@1.65.1
      - name: Ativar KVM (emulador acelerado)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulador Android 14 + teste
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: adb install -r app/android/app/build/outputs/apk/debug/app-debug.apk && node teste/e2e/importacao.mjs android
