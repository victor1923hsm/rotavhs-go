<!doctype html>
<html lang="pt-BR" data-theme="claro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#171B19" />
    <meta name="description" content="RotaVHS Go — rotas de entrega: importar, conferir, rodar e marcar." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>RotaVHS Go</title>
    <script>
      // Aplica o tema salvo antes do primeiro desenho (evita piscar). Padrão: Claro (cores do Figma).
      // Nomes antigos: "sol" → claro, "noite" → escuro.
      try {
        var t = localStorage.getItem('rotavhsgo.tema')
        if (t === 'noite') t = 'escuro'
        if (t !== 'alta' && t !== 'escuro') t = 'claro'
        document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
      // Dentro do APK Android (Capacitor): marca a página para usar as margens seguras da tela.
      try {
        if (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) document.documentElement.setAttribute('data-nativo', '')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>O RotaVHS Go precisa de JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
